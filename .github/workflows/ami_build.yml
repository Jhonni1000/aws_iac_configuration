name: Packer EC2 AMI Build

on:
    push:
        tags: ["v[0-9].[0-9]+.[0-9]+"]
        branches:
            - test
        paths:
            - "/packer/**"
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

env:
    PK_WORKING_DIR: ./packer

jobs:
    Packer:
        name: Packer EC2 Build
        runs-on: ubuntu-latest
        environment: staging
        defaults:
            run:
                working-directory: ${{ env.PK_WORKING_DIR }}
        steps:
            - name: Configure AWS Credentials with Secrets Region
              uses: aws-actions/configure-aws-credentials@v4
              with: 
                role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                aws-region: ${{ vars.AWS_REGION }}
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Packer
              uses: hashicorp/setup-packer@v3
            - name: Packer Init
              run: |
                packer init .
            - name: Packer Build
              if: |
                startsWith(github.ref, 'refs/heads/test') ||
                startsWith(github.ref, 'refs/tags/')
              run: |
                packer build .
                



